[project]
name = "regintel-mcp"
version = "0.5.0"
description = "Drop-in regulatory data for your Claude / LLM agent. Query GDPR, MiCA, DORA, AASB-S2 climate disclosure, Australian Migration Act / OMARA Code / Skilled Occupation List, NDIS Pricing Arrangements + Practice Standards, KYC/AML across 41 jurisdictions — cited to regulator sources. list_jurisdictions works without a key; free key (100 credits, no card) at regintelapi.com/k."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RegIntel", email = "support@regintelapi.com" }]
keywords = ["mcp", "model-context-protocol", "regulatory", "compliance", "regtech", "fintech", "gdpr", "kyc", "aml", "aasb-s2", "migration-act", "omara", "ndis", "australia"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "mcp[cli]>=1.2.0",
  "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://regintelapi.com/"
Documentation = "https://regintelapi.com/docs.html"
Repository = "https://github.com/ad0750/regintel-mcp"
Issues = "https://github.com/ad0750/regintel-mcp/issues"

[project.scripts]
regintel-mcp = "regintel_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regintel_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]
